<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stella idle Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1226;--pn:#181d3d;--ln:#2b3369;--tx:#e3e8ff;--mu:#8e98d0;--ac:#7fe0c8;--au:#ffcf5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "DotGothic16","MS Gothic",monospace;font-variant-numeric:tabular-nums;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--au);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){main{grid-template-columns:340px minmax(0,1fr)}}
h1{font-size:15px;margin:0;color:var(--mu);font-weight:700}
.big{font-size:clamp(34px,8vw,48px);font-weight:900;line-height:1.1;margin:6px 0 0;color:var(--au);word-break:break-all}
.sub{color:var(--mu);margin:2px 0 14px}
#star{position:relative;display:block;margin:10px auto 18px;width:220px;height:220px;border:0;padding:0;background:none;filter:drop-shadow(0 0 22px #ffcf5c66);transition:transform .06s}#star svg{width:100%;height:100%;display:block;pointer-events:none}
#star:active{transform:scale(.94)}
#star span{position:absolute;inset:0;display:grid;place-items:center;color:#4a2a05;font-weight:900;font-size:22px}
.fl{position:fixed;pointer-events:none;color:var(--au);font-weight:700;animation:up .9s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@media(prefers-reduced-motion:reduce){.fl{animation:none;opacity:.8}#star{transition:none}}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:13px;color:var(--mu)}
.box b{color:var(--tx)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav button,.bm button{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 12px}
nav button[aria-pressed=true],.bm button[aria-pressed=true]{background:var(--ac);color:#06241d;border-color:var(--ac);font-weight:700}
.bm{display:flex;gap:6px;margin-bottom:10px;align-items:center;color:var(--mu);font-size:13px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row h3{margin:0;font-size:15px}.row p{margin:0;color:var(--mu);font-size:12.5px}
.row .buy{grid-row:1/3;grid-column:2;min-width:112px;background:var(--ac);color:#06241d;border:0;border-radius:8px;padding:8px;font-weight:700;text-align:center}
.row .buy:disabled{background:#262d5c;color:#6c76b0;cursor:not-allowed}
.row.done{opacity:.55}.row.lock{opacity:.4}
.row.gold{border-color:var(--au)}
#g{position:fixed;z-index:6;border:0;border-radius:50%;width:56px;height:56px;background:radial-gradient(circle,#fff,#ffcf5c);box-shadow:0 0 30px var(--au);font-size:26px;color:#7a4a00}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--ln);padding:8px 14px;border-radius:10px;z-index:7;max-width:90vw;display:none}
textarea{width:100%;height:90px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px monospace}
.btn{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;margin:6px 6px 0 0}
/* ドット絵スタイル */
body{background-image:radial-gradient(#ffffff1c 1.2px,transparent 1.3px);background-size:18px 18px;-webkit-font-smoothing:none;text-rendering:optimizeSpeed}
b,h1,h3,.big,button{font-weight:400}
button,textarea{font-family:inherit;border-radius:0}
button:active{transform:translateY(2px)}
.row,.box,nav button,.bm button,.btn,.row .buy,#toast,textarea{border:0;border-radius:0;box-shadow:0 -3px 0 var(--ln),0 3px 0 var(--ln),-3px 0 0 var(--ln),3px 0 0 var(--ln)}
.row .buy{box-shadow:0 -3px 0 #06241d,0 3px 0 #06241d,-3px 0 0 #06241d,3px 0 0 #06241d}
nav button[aria-pressed=true],.bm button[aria-pressed=true]{box-shadow:0 -3px 0 #fff,0 3px 0 #fff,-3px 0 0 #fff,3px 0 0 #fff}
.row.gold,#pm{box-shadow:0 -3px 0 var(--au),0 3px 0 var(--au),-3px 0 0 var(--au),3px 0 0 var(--au)}
.row{margin:3px 3px 14px}.box{margin:3px 3px 10px}nav{gap:12px;margin:3px}.bm{gap:12px;margin:3px 3px 14px}
#pm{width:calc(100% - 6px)!important;margin:3px 3px 13px!important}
textarea{width:calc(100% - 6px);margin:3px}.btn{margin:10px 10px 0 3px}
.row p,.box,.bm,.sub{font-size:16px}.row .buy{min-width:128px}
.big{font-size:32px;text-shadow:4px 4px 0 #7a4a00;letter-spacing:.04em}@media(min-width:420px){.big{font-size:48px}}
.fl{text-shadow:2px 2px 0 #000;font-size:18px}
#star{filter:drop-shadow(6px 6px 0 #0a0620)}
#g{border-radius:0;box-shadow:0 0 0 4px #7a4a00,0 0 30px var(--au)}
[hidden]{display:none!important}
select{font:inherit;background:var(--bg);color:var(--tx);border:0;border-radius:0;box-shadow:0 0 0 3px var(--ln);padding:4px 6px;max-width:100%}
#p-cos .btn{margin:8px 10px 0 3px}#p-cos .btn[aria-pressed=true]{background:var(--ac);color:#06241d}
#au .btn{margin:10px 10px 0 3px}#au .btn[aria-pressed=true]{background:var(--ac);color:#06241d}
</style></head><body>
<main>
<section>
<h1>Stella idle Clicker</h1>
<div class="big" id="d">0</div>
<p class="sub" id="ps">毎秒 0</p>
<button id="star" aria-label="星を磨く"></button>
<button class="btn" id="pm" hidden style="width:100%;margin:0 0 10px;border-color:var(--au);color:var(--au);font-weight:700"></button><div class="box" id="st"></div><div class="box" id="au" hidden></div>
</section>
<section>
<nav id="tabs"></nav>
<div id="p-gen"><div class="bm" id="bm">購入数</div><div id="gens"></div></div>
<div id="p-up" hidden></div>
<div id="p-pre" hidden></div>
<div id="p-inf" hidden></div><div id="p-eter" hidden></div><div id="p-uni" hidden></div><div id="p-cos" hidden></div><div id="p-rp" hidden></div><div id="p-ach" hidden></div>
<div id="p-sv" hidden>
<p class="sub">進行状況はこのブラウザに自動保存されます。別の端末へ移すときは書き出して貼り付けてください。</p>
<textarea id="ta" aria-label="セーブデータ"></textarea><br>
<button class="btn" id="ex">書き出す</button><button class="btn" id="im">読み込む</button><button class="btn" id="rs">全消去</button>
</div>
</section>
</main>
<div id="toast" role="status"></div>
<script>
const U4=['','万','億','兆','京','垓','𥝱','穣','溝','澗','正','載','極'];
const f=x=>{if(!isFinite(x))return'∞';if(x<1e4)return x<100&&x%1?x.toFixed(1):Math.floor(x)+'';const i=Math.floor(Math.log10(x)/4);return i>12?x.toExponential(2):(x/1e4**i).toFixed(2)+U4[i]};
const G=[['星屑拾い',15,.1],['流星網',100,1],['彗星鉱山',1100,8],['月の精錬炉',12e3,47],['恒星鍛造所',13e4,260],['銀河紡績',14e5,1400],['星雲工場',2e7,7800],['宇宙卵',33e7,44e3],['時の砂時計',51e8,26e4]];

['星海の渦','暗黒物質炉','重力井戸','事象の地平線','銀河団の鍛冶場','真空の泉','次元の織機','因果の織機','多元宇宙の種','時空の織り手','原初の炎','無限の蓄音機','虚空の図書館','星々の記憶','創世の槌','終焉の砂'].forEach((n,k)=>G.push([n,5.1e9*40**(k+1),2.6e5*30**(k+1)]));
{const P1=['星','月','陽','銀河','虚空','時','因果','原初','終焉','無限','創世','暗黒','光','夢','記憶','運命','魂','幻','神','宇宙','次元','混沌','秩序','永遠'],S1=['炉','工房','塔','泉','織機','炎','庭','門'];for(let t=17;t<=191;t++){const k=t-17;G.push([P1[k%24]+'の'+S1[Math.floor(k/24)],5.1e9*40**16*30**(t-16),2.6e5*30**16*25**(t-16)])}}
const UP=[
{id:'c1',n:'指先の熱',d:'クリック ×2',c:200,v:()=>1,t:'c',m:2},
{id:'c2',n:'磨き布',d:'クリック ×5',c:1e5,v:()=>S.all>=2e4,t:'c',m:5},
{id:'cp',n:'共鳴',d:'クリックが毎秒産出の3%も生む',c:5e4,v:()=>S.all>=1e4,t:'cp'},
{id:'g1',n:'星の羅針盤',d:'全体 ×1.5',c:5e3,v:()=>S.all>=1e3,t:'G',m:1.5},
{id:'g2',n:'工房の拡張',d:'全体 ×2',c:2e6,v:()=>S.all>=4e5,t:'G',m:2},
{id:'g3',n:'二重螺旋',d:'全体 ×3',c:5e8,v:()=>S.all>=1e8,t:'G',m:3},
{id:'g4',n:'銀河の潮汐',d:'全体 ×5',c:1e11,v:()=>S.all>=2e10,t:'G',m:5},
{id:'g5',n:'因果の歯車',d:'全体 ×10',c:3e13,v:()=>S.all>=6e12,t:'G',m:10}];
G.slice(0,25).forEach((g,i)=>{UP.push({id:'a'+i,n:g[0]+'の改良',d:g[0]+' ×3',c:g[1]*15,v:()=>S.n[i]>=1,t:'g',i,m:3},{id:'b'+i,n:g[0]+'の極意',d:g[0]+' ×3',c:g[1]*3e3,v:()=>S.n[i]>=10,t:'g',i,m:3})});
const PU=[['初期星屑','超新星のあと、星屑1億から再開',1],['黄金の星','黄金の星の出現間隔が半分',3],['自動購入','施設を毎秒1基ずつ自動で買い足す',5],['星の記憶','全体 ×2',10],['指の達人','クリック ×10',20],['時間旅行','放置の稼ぎが100%反映(通常は50%)',50]];
const A=[];
[1e3,1e6,1e9,1e12,1e15,1e18].forEach(v=>A.push(['星屑の山 '+f(v),'累計で星屑を'+f(v)+'集める',()=>S.all>=v]));
[100,1e3,1e4].forEach(v=>A.push(['クリック職人 '+v,'星を'+v+'回磨く',()=>S.clicks>=v]));
[50,200,500,1000].forEach(v=>A.push(['施設 '+v+'基','施設を合計'+v+'基持つ',()=>S.n.reduce((a,b)=>a+b,0)>=v]));
[1,5,20].forEach(v=>A.push(['超新星 '+v+'回','超新星を'+v+'回起こす',()=>S.runs>=v]));
[1,10,50].forEach(v=>A.push(['黄金の星 '+v,'黄金の星を'+v+'個つかまえる',()=>S.gold>=v]));
[1,10,100,500].forEach(v=>A.push(['インフィニティ '+v,'インフィニティに通算'+v+'回到達する',()=>S.infAll>=v]));
[1,1e3,1e30,1e100].forEach(v=>A.push(['新星の輝き '+f(v),'新星ポイントを'+f(v)+'まで貯める',()=>S.ilMax>=Math.log10(v)]));
[1,5,20].forEach(v=>A.push(['エタニティ '+v,'エタニティに'+v+'回到達する',()=>S.eter>=v]));
A.push(['限界突破','星屑が1e308に到達する',()=>S.tl>=308],['増幅の達人','新星の増幅をLv100にする',()=>S.amp>=100]);
let T={};const R=(a,b,s)=>{const o=[];for(let k=a;k<=b;k+=s)o.push(k);return o},E=k=>10**k;
const mk=(c,d,vs,fn,fm=f)=>vs.forEach(v=>A.push([c+' '+fm(v),d.replace('#',fm(v)),()=>fn(v)]));

mk('産出の奔流','毎秒の産出が#に達する',R(4,300,4).map(E),v=>T.dps>=v);
mk('倍率の塔','全体倍率が×#に達する',R(4,288,4).map(E),v=>T.gm>=v);
mk('指先の閃光','1回のクリックで#稼ぐ',R(3,150,3).map(E),v=>T.cv>=v);
mk('星核の山','星核を累計#個集める',R(1,141,4).map(E),v=>S.cl>=Math.log10(v));
mk('新星の海','新星ポイントを#まで貯める',R(5,305,10).map(E),v=>S.ilMax>=Math.log10(v));
G.slice(0,9).forEach((g,i)=>mk(g[0]+'の主','#基の'+g[0]+'を同時に所持する',[10,25,50,100,150,200,300,400,500,750,1000],v=>S.n[i]>=v,v=>v));
mk('クリック職人','星を#回磨く',[3e4,1e5,3e5,1e6,3e6,1e7,3e7,1e8,3e8,1e9],v=>S.clicks>=v);
mk('施設の王国','施設を合計#基持つ',[1500,2000,3000,5000,7500,1e4],v=>S.n.reduce((a,b)=>a+b,0)>=v);
mk('超新星の使い手','超新星を#回起こす',[50,100,200,500,1e3,2e3,5e3,1e4],v=>S.runs>=v,v=>v);
mk('黄金の収集家','黄金の星を#個つかまえる',[100,200,500,1e3,2e3,5e3],v=>S.gold>=v,v=>v);
mk('無限の旅人','インフィニティに通算#回到達する',[1e3,2500,5e3,1e4],v=>S.infAll>=v,v=>v);
mk('増幅の極み','新星の増幅をLv#にする',[10,25,50,150,200,250,300,350,400,440],v=>S.amp>=v,v=>v);
mk('新星の蔵','新星の強化を#個取得する',[1,2,3,4,5,6],v=>Object.keys(S.ipu).length>=v,v=>v);
mk('永遠の旅人','エタニティに#回到達する',[50,100,250,500,1e3],v=>S.eter>=v,v=>v);
mk('超新星の輝き','超新星ポイントを#まで貯める',[1,10,100,1e3,1e4,1e6,1e9,1e12,1e20,1e50,1e100,1e200,1e300],v=>S.elMax>=Math.log10(v));
mk('超新星の増幅','超新星の増幅をLv#にする',[1,5,10,25,50,100,200,300,400],v=>S.eamp>=v,v=>v);
mk('永遠の蔵','エタニティの強化を#個取得する',[1,2,3],v=>Object.keys(S.epu).length>=v,v=>v);
mk('実績コレクター','実績を#個解放する',[50,100,150,200,250,300,350,400,450,500,550],v=>Object.keys(S.ach).length>=v,v=>v);
mk('時を紡ぐ者','合計#時間遊ぶ',[1,2,5,10,24,48,72,100,150,200,300,500,750,1e3,2e3],v=>S.pt>=v*3600,v=>v);
A.push(['完全制覇','ほかのすべての実績を解放する',()=>Object.keys(S.ach).length>=A.length-1]);
G.slice(9,25).forEach((g,j)=>mk(g[0]+'の覇者','#基の'+g[0]+'を同時に所持する',[50,200,1000],v=>S.n[j+9]>=v,v=>v));
mk('新星の大蔵','新星の強化を#個取得する',[10,20,30,40,48],v=>Object.keys(S.ipu).length>=v,v=>v);
mk('永遠の大蔵','エタニティの強化を#個取得する',[5,10,15,22],v=>Object.keys(S.epu).length>=v,v=>v);
mk('超新星の光','超新星ポイントを1e#まで貯める',R(400,2400,200),v=>S.elMax>=v,v=>v);
mk('永遠の宝物殿','エタニティの強化を#個取得する',[30,40,50],v=>Object.keys(S.epu).length>=v,v=>v);
mk('惑星の開拓者','惑星を#個解放する',[1,3,5,8],v=>S.pls.filter(x=>x).length>=v,v=>v);
mk('星座の観測者','星座を#個発見する',[1,4,8,12],v=>S.cons.filter(x=>x).length>=v,v=>v);
mk('星座の達人','星座のLvを合計#にする',[10,30,60,100],v=>S.cons.reduce((a,b)=>a+b,0)>=v,v=>v);
mk('闇の底','ブラックホール質量が#に達する',[1e10,1e50,1e100,1e200,1e300],v=>S.bh>=v);
mk('暗黒の宝庫','暗黒物質を#持つ',[1e3,1e6,1e9,1e12,1e15],v=>S.dm>=v);
mk('銀河の主','銀河のLvを合計#にする',[5,25,50,100,150],v=>S.gx.reduce((a,b)=>a+b,0)>=v,v=>v);
mk('銀河団','銀河を#個形成する',[1,3,6],v=>S.gx.filter(x=>x).length>=v,v=>v);
mk('星屑の限界','今回の累計星屑を1e#に到達させる',[350,400,500,700,1000,1500,2000],v=>S.tl>=v,v=>v);
mk('新星の深淵','新星ポイントを1e#まで貯める',[400,600,800,1200,1600,2000],v=>S.ilMax>=v,v=>v);
mk('ユニティの深淵','ユニティポイントを1e#まで貯める',[100,200,300,400,600],v=>S.ulMax>=v,v=>v);
mk('星核の大海','星核を累計1e#個集める',R(150,1000,50),v=>S.cl>=v,v=>v);
mk('惑星の大航海','惑星を#個解放する',[12,16],v=>S.pls.filter(x=>x).length>=v,v=>v);
mk('星座の大観測','星座を#個発見する',[18,24],v=>S.cons.filter(x=>x).length>=v,v=>v);
mk('星座の極み','星座のLvを合計#にする',[150,200,240],v=>S.cons.reduce((a,b)=>a+b,0)>=v,v=>v);
mk('銀河の大集団','銀河を#個形成する',[9,12],v=>S.gx.filter(x=>x).length>=v,v=>v);
mk('銀河の覇者','銀河のLvを合計#にする',[200,250,300],v=>S.gx.reduce((a,b)=>a+b,0)>=v,v=>v);
mk('終わりなき道','無限強化のLvを合計#にする',[10,100,1000,1e4,1e5],v=>Object.values(S.rl).flat().reduce((a,b)=>a+b,0)>=v);
G.slice(25).forEach((g,j)=>mk(g[0]+'の頂','#基の'+g[0]+'を同時に所持する',[100],v=>S.n[j+25]>=v,v=>v));
mk('神速のインフィニティ','インフィニティに#秒以内で到達する',[3600,1800,900,600,300,120,60,30,10],v=>S.fastInf<=v,v=>v);
A.push(['無血のインフィニティ','超新星を一度も起こさずにインフィニティに到達する',()=>S.noNova==1]);
mk('神速のエタニティ','エタニティに#秒以内で到達する',[7200,3600,1800,600,300,60],v=>S.fastEter<=v,v=>v);
mk('神速のユニティ','ユニティに#秒以内で到達する',[86400,43200,21600,7200,3600],v=>S.fastUni<=v,v=>v);
mk('星屑の極限','今回の累計星屑を1e#に到達させる',[3000,5000,1e4,2e4],v=>S.tl>=v,v=>v);
mk('新星の極限','新星ポイントを1e#まで貯める',[3000,5000,1e4],v=>S.ilMax>=v,v=>v);
mk('ユニティの極限','ユニティポイントを1e#まで貯める',[1000,2000,5000,1e4],v=>S.ulMax>=v,v=>v);

const ipGL=()=>{const l=S.amp*.69897+lg('ip')+(S.epu[0]?6:0)+Math.max(0,Math.min(S.tl,1e5)-308)/(50/(1+EFo.ov));return l<12?Math.log10(Math.max(1,Math.round(10**l))):l};
const unGL=()=>{const l=S.uamp*.69897+lg('un');return l<12?Math.log10(Math.max(1,Math.round(10**l))):l};
const buyIP=()=>{let c=0;while(S.il>=S.amp*.60206-1e-9&&c++<5000){S.il=lsub(S.il,S.amp*.60206);S.amp++}};
const buyUN=()=>{let c=0;while(S.ul>=S.uamp*.60206-1e-9&&c++<5000){S.ul=lsub(S.ul,S.uamp*.60206);S.uamp++}};
const lcOf=p=>p[5]??Math.log10(p[2]);
const rowL=(l,st,cur)=>l.map((p,i)=>`<div class='row ${st[i]?'done':''}'><h3>${p[0]}</h3><p>${p[1]}</p><button class='buy' data-q='${i}' ${st[i]||cur<lcOf(p)-1e-9?'disabled':''}>${st[i]?'取得済み':(p[5]?fL(p[5]):f(p[2]))}</button></div>`).join('');
function renderInf(){const ac=S.amp*.60206;$('p-inf').innerHTML=`<div class='box' style='margin-bottom:10px'>星屑が<b>1e308</b>に届くとインフィニティに到達できます(さらに集めると、50桁ごとに獲得が10倍)。星核・強化・施設を失う代わりに<b>新星ポイント</b>を得ます。新星ポイントに上限はありません。<br>新星ポイント <b>${fL(S.il)}</b> ／ 通算 ${S.infAll} 回 ／ 次の獲得 <b>${fL(ipGL())}</b><br>新星ポイントが1e308に届くと、エタニティに到達できます(さらに貯めると獲得ボーナス)。</div><div class='row gold'><h3>新星の増幅 Lv${S.amp}</h3><p>新星ポイント獲得 ×5 (次のコスト ${fL(ac)})</p><button class='buy' data-q='a' ${S.il<ac-1e-9?'disabled':''}>購入</button></div>`+rowL(IPU,S.ipu,S.il)}
$('p-inf').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const q=b.dataset.q;if(q=='a')buyIP();else if(!S.ipu[q]&&S.il>=lcOf(IPU[q])-1e-9){S.il=lsub(S.il,lcOf(IPU[q]));S.ipu[q]=1}recalcEF();renderInf()};
function renderUni(){const ac=S.uamp*.60206;$('p-uni').innerHTML=`<div class='box' style='margin-bottom:10px'>超新星ポイントが<b>1e2466</b>に届くとユニティに到達できます。エタニティ以下のほぼすべてを失う代わりに<b>ユニティポイント</b>を得ます。ユニティポイントに上限はありません。<br>ユニティポイント <b>${fL(S.ul)}</b> ／ 通算 ${S.uni} 回 ／ 次の獲得 <b>${fL(unGL())}</b></div><div class='row gold'><h3>ユニティの増幅 Lv${S.uamp}</h3><p>ユニティポイント獲得 ×5 (次のコスト ${fL(ac)})</p><button class='buy' data-q='a' ${S.ul<ac-1e-9?'disabled':''}>購入</button></div>`+rowL(UNU,S.unu,S.ul)}
$('p-uni').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const q=b.dataset.q;if(q=='a')buyUN();else if(!S.unu[q]&&S.ul>=lcOf(UNU[q])-1e-9){S.ul=lsub(S.ul,lcOf(UNU[q]));S.unu[q]=1}recalcEF();renderUni()};
S.pls=PN.map((_,i)=>S.pls[i]||0);S.plc=PN.map((_,i)=>S.plc[i]??-1);S.cons=CON.map((_,i)=>S.cons[i]||0);S.gx=GX.map((_,i)=>S.gx[i]||0);
const gainL=()=>{const l=(S.tl-9)/2+(S.ipu[5]?1:0)+lg('cg');if(l<12){const v=Math.floor(10**l+1e-9);return v>=1?Math.log10(v):-9}return l};
function renderPre(){const av=lsub(S.cl,S.spl),g=gainL();$('p-pre').innerHTML=`<div class='box' style='margin-bottom:10px'>星を崩壊させると、施設と強化を失う代わりに<b>星核</b>を得ます。星核は全体の産出を大きく増やし、下の永続強化にも使えます(上限なし)。<br>所持 <b>${fL(av)}</b>(累計 ${fL(S.cl)}) ／ 今回の獲得 <b>${fL(g)}</b></div><div class='row gold'><h3>超新星を起こす</h3><p>${g>-9?'星核を'+fL(g)+'個得られます':'星屑約1e9で最初の星核が得られます'}</p><button class='buy' id='nova' ${g<=-9?'disabled':''}>${armed?'本当に?':'起こす'}</button></div>`+PU.map((p,i)=>`<div class='row ${S.pu[i]?'done':''}'><h3>${p[0]}</h3><p>${p[1]}</p><button class='buy' data-p='${i}' ${S.pu[i]||av<lcOf(p)-1e-9?'disabled':''}>${S.pu[i]?'取得済み':(p[5]?'星核 '+fL(p[5]):'星核 '+f(p[2]))}</button></div>`).join('')}
$('p-pre').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id=='nova'){if(!armed){armed=1;setTimeout(()=>{armed=0;renderPre()},3000);renderPre();return}armed=0;nova();return}const i=+b.dataset.p,c=lcOf(PU[i]);if(!S.pu[i]&&lsub(S.cl,S.spl)>=c-1e-9){S.spl=ladd(S.spl,c);S.pu[i]=1;recalcEF();renderPre()}};
const RPN={pu:'超新星(星核)',inf:'インフィニティ(新星ポイント)',eter:'エタニティ(超新星ポイント)',uni:'ユニティ(ユニティポイント)'};
const rpCur=g=>g=='pu'?lsub(S.cl,S.spl):g=='inf'?S.il:g=='eter'?S.el:S.ul;
const rpCost=(g,i)=>RP[g][i][3]+RP[g][i][4]*S.rl[g][i];
function rpBuy(g,i,n){let c=0;while(c<n&&rpCur(g)>=rpCost(g,i)-1e-9){const k=rpCost(g,i);if(g=='pu')S.spl=ladd(S.spl,k);else if(g=='inf')S.il=lsub(S.il,k);else if(g=='eter')S.el=lsub(S.el,k);else S.ul=lsub(S.ul,k);S.rl[g][i]++;c++}}
function renderRP(){let h='';for(const g in RP){h+=`<h3 style='margin:16px 3px 8px'>${RPN[g]} ― 所持 ${fL(rpCur(g))}</h3>`+RP[g].map((r,i)=>{const L=S.rl[g][i],c=rpCost(g,i),ok=rpCur(g)>=c-1e-9;return `<div class='row'><h3>${r[0]} Lv${L}</h3><p>${r[5]}${fL(L*Math.log10(r[2]))} (1Lvごとに ×${f(r[2])}) ／ 次のコスト ${fL(c)}</p><div><button class='buy' data-g='${g}' data-i='${i}' data-n='1' ${ok?'':'disabled'}>+1</button> <button class='buy' data-g='${g}' data-i='${i}' data-n='1000' ${ok?'':'disabled'}>最大</button></div></div>`}).join('')}$('p-rp').innerHTML=`<div class='box' style='margin-bottom:10px'>どの層でも、レベルに上限のない強化です。コストは1レベルごとに上がり続けます。超新星の分はインフィニティで、インフィニティの分はエタニティで、エタニティの分はユニティでリセットされます(保持系の強化で残せます)。</div>`+h}
$('p-rp').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;rpBuy(b.dataset.g,+b.dataset.i,+b.dataset.n);recalcEF();renderRP()};
// セーブ
const save=()=>{S.last=now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
$('ex').onclick=()=>{save();$('ta').value=btoa(JSON.stringify(S));$('ta').select()};
$('im').onclick=()=>{try{S=Object.assign(def(),JSON.parse(atob($('ta').value.trim())));S.n=G.map((_,i)=>S.n[i]||0);upKey='';achN=-1;toast('読み込みました')}catch(e){toast('読み込めません。書き出したデータをそのまま貼り付けてください')}};
let rsA=0;$('rs').onclick=()=>{if(!rsA){rsA=1;$('rs').textContent='もう一度押すと全消去';setTimeout(()=>{rsA=0;$('rs').textContent='全消去'},3000);return}S=def();upKey='';achN=-1;save();location.reload()};
addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
// ドット絵の星
{const N=25,c=N/2,cy=c+1.2,R=12,r=5,P=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;P.push([c+q*Math.cos(a),cy+q*Math.sin(a)])}
const ins=(x,y)=>{let w=false;for(let i=0,j=9;i<10;j=i++){const[a,b]=P[i],[p,q]=P[j];if((b>y)!=(q>y)&&x<(p-a)*(y-b)/(q-b)+a)w=!w}return w};
const F=[];for(let y=0;y<N;y++){F[y]=[];for(let x=0;x<N;x++)F[y][x]=ins(x+.5,y+.5)}
let s='';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(F[y][x]){const e=!F[y-1]?.[x]||!F[y+1]?.[x]||!F[y][x-1]||!F[y][x+1],d=Math.hypot(x+.5-c,y+.5-cy);s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${e?'#8a4a0c':d<3?'#fff4b8':x+y<N-1?'#ffcf5c':'#e29a2e'}"/>`}
$('star').innerHTML=`<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`}
// クリック
$('star').onclick=e=>{const v=cval();add(v);S.clicks++;const s=document.createElement('div');s.className='fl';s.textContent='+'+f(v);s.style.left=(e.clientX||innerWidth/2)-12+'px';s.style.top=(e.clientY||200)-20+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),900)};
// 黄金の星
let gt=now()+(S.pu[1]?30:60)*1e3+Math.random()*3e4,ge=null;
function goldTick(){if(ge){if(now()>ge.x){ge.e.remove();ge=null;gt=now()+(S.pu[1]?.5:1)*(60+Math.random()*60)*1e3/EFo.gf}return}
if(now()<gt)return;const e=document.createElement('button');e.id='g';e.textContent='★';e.setAttribute('aria-label','黄金の星');e.style.left=10+Math.random()*(innerWidth-90)+'px';e.style.top=80+Math.random()*(innerHeight-180)+'px';
e.onclick=()=>{S.gold++;const r=Math.random(),D=dps();if(r<.5){const x=Math.max(D*600,100)*EFo.gb;add(x);toast('黄金の星! 星屑 +'+f(x))}else if(r<.8){S.buff.x7=now()+3e4;toast('黄金の星! 30秒間、産出 ×7')}else{S.buff.cl=now()+15e3;toast('黄金の星! 15秒間、クリック ×77')}e.remove();ge=null;gt=now()+(S.pu[1]?.5:1)*(60+Math.random()*60)*1e3/EFo.gf};
document.body.appendChild(e);ge={e,x:now()+13e3}}
// 毎フレームの更新
let lt=now(),ab=0;
function tick(){const t=now(),dt=Math.min((t-lt)/1e3,60);lt=t;recalcEF();tick.dl=dpsL();S.tl=ladd(S.tl,tick.dl+Math.log10(Math.max(dt,1e-6)));add(dps()*dt);goldTick();
if(S.pu[2]&&!S.off.fac&&(ab+=dt)>=1){ab=0;G.forEach((_,i)=>{if(S.d>=cost(i,1))buy(i)})}
if(S.ipu[1]&&!S.off.nova&&(tick.an=(tick.an||0)+dt)>=1){tick.an=0;if(gainL()>=Math.max(0,S.cl))nova(1)}
if(S.epu[2]&&!S.off.amp&&(tick.ae=(tick.ae||0)+dt)>=1){tick.ae=0;buyIP()}
if(EFo.ak&&!S.off.ak){add(cval()*EFo.ak*dt);S.clicks+=EFo.ak*dt}
if(EFo.au&&!S.off.up&&(tick.au=(tick.au||0)+dt)>=1){tick.au=0;for(const u of UP)if(!S.up[u.id]&&u.v()&&S.d>=u.c){S.d-=u.c;S.up[u.id]=1;upKey=''}}
if(EFo.ai&&!S.off.ipu&&(tick.ai=(tick.ai||0)+dt)>=1){tick.ai=0;IPU.forEach((u,i)=>{const lc=u[5]??Math.log10(u[2]);if(!S.ipu[i]&&S.il>=lc-1e-9){S.il=lsub(S.il,lc);S.ipu[i]=1}})}
if(EFo.ae&&!S.off.eter&&S.il>=308)eternity();
if(S.tl>=S.itg&&S.ipu[3]&&!S.off.inf)infinity();
S.ilMax=Math.max(S.ilMax,S.il);
{const L=AU.filter(a=>a[2]()),k=L.map(a=>a[0]+!S.off[a[0]]).join()+S.itg;if(tick.ka!=k){tick.ka=k;$('au').hidden=!L.length;$('au').innerHTML='自動化 (押すとON/OFF切替)<div>'+L.map(a=>`<button class='btn' data-a='${a[0]}' aria-pressed='${!S.off[a[0]]}'>${a[1]} ${S.off[a[0]]?'OFF':'ON'}</button>`).join('')+(S.ipu[3]?`<button class='btn' data-a='itg'>自動インフィニティ目標 e${S.itg}</button>`:'')+'</div>'}}
{const pm=$('pm'),m=S.el>=2466?'u':S.il>=308?'e':S.tl>=308?'i':'';pm.hidden=!m;pm.dataset.m=m;if(m)pm.textContent=m=='u'?'ユニティに到達する(ユニティポイント +'+fL(unGL())+')':m=='e'?'エタニティに到達する(超新星ポイント +'+fL(epGL())+')':'インフィニティに到達する(新星ポイント +'+fL(ipGL())+')'}
S.dm+=dmRate()*dt;if(S.bhAuto&&(tick.bh=(tick.bh||0)+dt)>=1){tick.bh=0;const x=S.d*.1;S.bh=Math.min(S.bh+x,1.7e308);S.d-=x}
T={dps:dps(),gm:gM(),cv:cval()};S.pt+=dt;S.rt+=dt;S.rtE+=dt;S.rtU+=dt;S.elMax=Math.max(S.elMax,S.el);S.ulMax=Math.max(S.ulMax,S.ul);
A.forEach((a,i)=>{if(!S.ach[i]&&a[2]()){S.ach[i]=1;toast('実績解放: '+a[0])}});
$('d').textContent=f(S.d);$('ps').textContent='毎秒 '+(tick.dl>300?fL(tick.dl):f(dps()))+'  ／ クリック '+f(cval());document.title=f(S.d)+' - Stella idle Clicker';
const buffs=[S.buff.x7>t?'産出×7 残り'+Math.ceil((S.buff.x7-t)/1e3)+'秒':'',S.buff.cl>t?'クリック×77 残り'+Math.ceil((S.buff.cl-t)/1e3)+'秒':''].filter(Boolean).join(' / ');
$('st').innerHTML=`全体倍率 <b>×${f(gM())}</b> ／ 星核 <b>${fL(S.cl)}</b>${S.infAll?` ／ 新星ポイント <b>${fL(S.il)}</b>`:''}${S.eter?` ／ 超新星ポイント <b>${fL(S.el)}</b>`:''}${S.uni?` ／ ユニティポイント <b>${fL(S.ul)}</b>`:''}<br>今回の累計 <b>${fL(S.tl)}</b> ／ 通算 <b>${f(S.all)}</b><br>クリック <b>${Math.floor(S.clicks)}</b> 回 ／ 黄金の星 <b>${S.gold}</b> 個 ／ 超新星 <b>${S.runs}</b> 回`+(buffs?`<br><b style="color:var(--au)">${buffs}</b>`:'')+(offMsg?`<br>${offMsg}`:'');
if(tab=='gen')G.forEach((g,i)=>{const k=kOf(i),c=cost(i,k),ms=MS.find(x=>x>S.n[i]);$('o'+i).textContent='× '+S.n[i];
$('e'+i).textContent=`1基 ${f(g[2]*genM(i)*gM())}/秒 ・ 計 ${f(g[2]*genM(i)*gM()*S.n[i])}/秒`+(ms?` ・ ${ms}基で ×2`:'');
const b=$('r'+i).querySelector('.buy');b.textContent=`+${k} / ${f(c)}`;b.disabled=S.d<c;$('r'+i).classList.toggle('lock',S.d<G[i][1]*.5&&!S.n[i]);$('r'+i).hidden=!(i<2||S.n[i-1]||S.n[i]||S.all>=G[i][1]*.3)});
if(tab=='up'){renderUp();$('p-up').querySelectorAll('.buy').forEach(b=>b.disabled=S.d<UP.find(u=>u.id==b.dataset.u).c)}
if(tab=='pre'&&!armed){const k=fL(gainL())+'|'+fL(lsub(S.cl,S.spl));if(tick.k!=k){tick.k=k;renderPre()}}
if(tab=='ach')renderAch();if(tab=='inf'){const k=[fL(S.il),S.amp,JSON.stringify(S.ipu),fL(ipGL())].join();if(tick.ki!=k){tick.ki=k;renderInf()}}if(tab=='rp'){const k=JSON.stringify(S.rl)+fL(lsub(S.cl,S.spl))+fL(S.il)+fL(S.el)+fL(S.ul);if(tick.kr!=k){tick.kr=k;renderRP()}}if(tab=='cos'){const k=JSON.stringify([S.pls,S.plc,S.cons,S.bhAuto,S.gx]);if(tick.kc!=k){tick.kc=k;renderCos()}updCos()}if(tab=='uni'){const k=[fL(S.ul),S.uamp,JSON.stringify(S.unu),fL(unGL())].join();if(tick.ku!=k){tick.ku=k;renderUni()}}if(tab=='eter'){const k=[fL(S.el),S.eamp,JSON.stringify(S.epu),fL(epGL())].join();if(tick.ke!=k){tick.ke=k;renderEter()}}}
// オフライン分の加算
{const off=Math.min((now()-S.last)/1e3,86400);if(off>60){const x=dps()*off*(S.pu[5]||EFo.of?1:.5);add(x);offMsg='おかえりなさい。放置中に星屑 '+f(x)+' を稼ぎました'}}
renderPre();renderUp();renderAch();renderInf();renderEter();renderCos();
setInterval(tick,100);setInterval(save,10000);tick();
